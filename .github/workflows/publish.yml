name: Publish NuGet package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ImzaKit.slnx -c Release

      - name: Test
        run: dotnet test ImzaKit.slnx -c Release --no-build

      - name: Pack single ImzaKit package
        run: dotnet pack packaging/ImzaKit/ImzaKit.csproj -c Release --no-build --output artifacts/packages

      - name: Verify package contract
        shell: pwsh
        run: ./scripts/verify-nuget-package.ps1

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not configured." >&2
            exit 1
          fi

          dotnet nuget push artifacts/packages/ImzaKit.1.0.0-alpha.1.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --symbol-source https://api.nuget.org/v3/index.json \
            --skip-duplicate
