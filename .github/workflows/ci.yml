name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so newly published NuGet advisories fail the build even without code changes.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ImzaKit.slnx -c Release

      - name: Test
        run: dotnet test ImzaKit.slnx -c Release --no-build

      # Runs the release scripts the way publish.yml does, with a throwaway key and a stable
      # version, so the provenance path is exercised before a real key is used.
      - name: Release bundle smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)
          OUT=artifacts/smoke
          dotnet pack packaging/ImzaKit/ImzaKit.csproj -c Release --no-build --output "$OUT"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/release.pem"
          openssl pkcs8 -topk8 -nocrypt -in "$RUNNER_TEMP/release.pem" -outform DER -out "$RUNNER_TEMP/release.p8"
          openssl pkey -in "$RUNNER_TEMP/release.pem" -pubout -out "$RUNNER_TEMP/release.pub.pem"
          IMZAKIT_RELEASE_ECDSA_KEY=$(base64 -w0 "$RUNNER_TEMP/release.p8") \
            dotnet run --file scripts/emit-release-bundle.cs -- \
            --package "$OUT/ImzaKit.$VERSION.nupkg" --output "$OUT" \
            --version 1.0.0 --commit "$GITHUB_SHA" --kind nuget
          dotnet run --file scripts/verify-release-provenance.cs -- \
            --package "$OUT/ImzaKit.$VERSION.nupkg" --sbom "$OUT/sbom.cdx.json" \
            --provenance "$OUT/provenance.json" --public-key "$RUNNER_TEMP/release.pub.pem" \
            --commit "$GITHUB_SHA" --version 1.0.0

      - name: Check vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list ImzaKit.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($LASTEXITCODE -ne 0) { throw 'dotnet list package failed.' }
          if ($report -match '(?m)^\s+>\s') { throw 'Vulnerable NuGet packages found.' }
