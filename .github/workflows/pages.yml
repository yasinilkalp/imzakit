name: Publish landing page

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/verify-landing-page.ps1
      - scripts/verify-open-source-readiness.ps1
      - .github/workflows/pages.yml
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - SECURITY.md
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify landing page
        shell: pwsh
        run: ./scripts/verify-landing-page.ps1

      - name: Verify open-source readiness
        shell: pwsh
        run: ./scripts/verify-open-source-readiness.ps1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
