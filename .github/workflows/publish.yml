name: Publish NuGet package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ImzaKit.slnx -c Release

      - name: Test
        run: dotnet test ImzaKit.slnx -c Release --no-build

      - name: Pack single ImzaKit package
        run: dotnet pack packaging/ImzaKit/ImzaKit.csproj -c Release --no-build --output artifacts/packages

      - name: Verify package contract
        shell: pwsh
        run: ./scripts/verify-nuget-package.ps1

      - name: Sign in to NuGet.org with OIDC
        uses: NuGet/login@v1
        id: login
        with:
          user: Kodekibi

      - name: Publish to NuGet.org
        shell: bash
        run: |
          dotnet nuget push artifacts/packages/ImzaKit.1.0.0-alpha.3.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --symbol-source https://api.nuget.org/v3/index.json
