name: Publish NuGet package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_nuget_org:
        description: Publish to NuGet.org
        type: boolean
        default: true

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  verify-pack:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          PROPS=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$PROPS" ]; then
              echo "Version mismatch tag=$VERSION props=$PROPS" >&2
              exit 1
            fi
          else
            VERSION="$PROPS"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "IMZAKIT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build ImzaKit.slnx -c Release

      - name: Test
        run: dotnet test ImzaKit.slnx -c Release --no-build

      - name: Pack single ImzaKit package
        run: dotnet pack packaging/ImzaKit/ImzaKit.csproj -c Release --no-build --output artifacts/packages

      - name: Emit SBOM and provenance
        env:
          IMZAKIT_RELEASE_ECDSA_KEY: ${{ secrets.IMZAKIT_RELEASE_ECDSA_KEY }}
          IMZAKIT_VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet run --file scripts/emit-release-bundle.cs --
          --package artifacts/packages/ImzaKit.${{ env.IMZAKIT_VERSION }}.nupkg
          --output artifacts/packages
          --version ${{ env.IMZAKIT_VERSION }}
          --commit "${{ github.sha }}"
          --kind nuget

      - name: Verify package contract
        shell: pwsh
        env:
          IMZAKIT_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/verify-nuget-package.ps1 -Version ${{ env.IMZAKIT_VERSION }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/sbom.cdx.json

  publish:
    name: Publish NuGet
    needs: verify-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      IMZAKIT_VERSION: ${{ needs.verify-pack.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          dotnet nuget push artifacts/packages/ImzaKit.${{ env.IMZAKIT_VERSION }}.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Sign in to NuGet.org with OIDC
        if: github.event_name == 'push' || inputs.publish_nuget_org
        uses: NuGet/login@v1
        id: login
        with:
          user: Kodekibi

      - name: Publish to NuGet.org
        if: github.event_name == 'push' || inputs.publish_nuget_org
        shell: bash
        run: |
          dotnet nuget push artifacts/packages/ImzaKit.${{ env.IMZAKIT_VERSION }}.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --symbol-source https://api.nuget.org/v3/index.json
